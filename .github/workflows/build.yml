name: Build Cross-Platform Executables

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: Meme-Matcher-Windows.exe
            sep: ";"
          - os: ubuntu-latest
            artifact_name: Meme-Matcher-Linux
            sep: ":"
          - os: macos-latest
            artifact_name: Meme-Matcher-macOS
            sep: ":"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build Executable
        shell: bash
        run: |
          pyinstaller --onefile --noconsole \
            --collect-all mediapipe \
            --add-data "face_landmarker.task${{ matrix.sep }}." \
            --add-data "hand_landmarker.task${{ matrix.sep }}." \
            main.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*